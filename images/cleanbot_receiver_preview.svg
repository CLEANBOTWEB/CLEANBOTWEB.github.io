<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2c22" />
      <stop offset="100%" stop-color="#0f1911" />
    </linearGradient>
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2e33" />
      <stop offset="100%" stop-color="#15171a" />
    </linearGradient>
    <linearGradient id="goldEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="50%" stop-color="#f3e5ab" />
      <stop offset="100%" stop-color="#d4af37" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" rx="16" />

  <!-- Title / Badge -->
  <g transform="translate(40, 45)">
    <rect width="210" height="34" rx="17" fill="#2d4a36" />
    <text x="105" y="22" fill="#9de6b2" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle">ROBOT 2 • RECEPTOR MÓVIL</text>
    <text x="0" y="65" fill="#f0f5ed" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="700">micro:bit Receptora con Alerta LED</text>
    <text x="0" y="88" fill="#a4b8a7" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Recibe señal de radio y notifica instantáneamente al recolector municipal</text>
  </g>

  <!-- micro:bit Board Body -->
  <g transform="translate(240, 150)">
    <!-- Main board body -->
    <rect x="0" y="0" width="320" height="250" rx="28" fill="url(#boardGrad)" stroke="#3f474f" stroke-width="3" />

    <!-- Top colorful silkscreen pattern (micro:bit style) -->
    <path d="M 0,28 Q 0,0 28,0 L 292,0 Q 320,0 320,28 L 320,65 L 0,65 Z" fill="#2e7d32" />
    <circle cx="160" cy="30" r="12" fill="#1b5e20" />
    <text x="160" y="34" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">micro:bit v2</text>

    <!-- Holes -->
    <circle cx="35" cy="30" r="8" fill="#121416" stroke="#d4af37" stroke-width="2" />
    <circle cx="285" cy="30" r="8" fill="#121416" stroke="#d4af37" stroke-width="2" />

    <!-- Button A & B -->
    <circle cx="55" cy="140" r="16" fill="#1e2226" stroke="#525c66" stroke-width="2" />
    <circle cx="55" cy="140" r="10" fill="#0b0d0e" />
    <text x="55" y="178" fill="#a0aab2" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">A</text>

    <circle cx="265" cy="140" r="16" fill="#1e2226" stroke="#525c66" stroke-width="2" />
    <circle cx="265" cy="140" r="10" fill="#0b0d0e" />
    <text x="265" y="178" fill="#a0aab2" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">B</text>

    <!-- 5x5 LED Display Area showing "!" or "FULL / LLENO" warning -->
    <rect x="100" y="90" width="120" height="120" rx="10" fill="#0d0e10" stroke="#1f2327" stroke-width="2" />

    <!-- LED Grid: Exclamation Mark Alert (Red LEDs Glowing) -->
    <!-- Row 0 -->
    <circle cx="120" cy="106" r="6" fill="#2d1010" />
    <circle cx="140" cy="106" r="6" fill="#2d1010" />
    <circle cx="160" cy="106" r="7" fill="#ff2e4c" filter="url(#glow)" />
    <circle cx="180" cy="106" r="6" fill="#2d1010" />
    <circle cx="200" cy="106" r="6" fill="#2d1010" />

    <!-- Row 1 -->
    <circle cx="120" cy="126" r="6" fill="#2d1010" />
    <circle cx="140" cy="126" r="6" fill="#2d1010" />
    <circle cx="160" cy="126" r="7" fill="#ff2e4c" filter="url(#glow)" />
    <circle cx="180" cy="126" r="6" fill="#2d1010" />
    <circle cx="200" cy="126" r="6" fill="#2d1010" />

    <!-- Row 2 -->
    <circle cx="120" cy="146" r="6" fill="#2d1010" />
    <circle cx="140" cy="146" r="6" fill="#2d1010" />
    <circle cx="160" cy="146" r="7" fill="#ff2e4c" filter="url(#glow)" />
    <circle cx="180" cy="146" r="6" fill="#2d1010" />
    <circle cx="200" cy="146" r="6" fill="#2d1010" />

    <!-- Row 3 (gap) -->
    <circle cx="120" cy="166" r="6" fill="#2d1010" />
    <circle cx="140" cy="166" r="6" fill="#2d1010" />
    <circle cx="160" cy="166" r="6" fill="#2d1010" />
    <circle cx="180" cy="166" r="6" fill="#2d1010" />
    <circle cx="200" cy="166" r="6" fill="#2d1010" />

    <!-- Row 4 (dot) -->
    <circle cx="120" cy="186" r="6" fill="#2d1010" />
    <circle cx="140" cy="186" r="6" fill="#2d1010" />
    <circle cx="160" cy="186" r="7" fill="#ff2e4c" filter="url(#glow)" />
    <circle cx="180" cy="186" r="6" fill="#2d1010" />
    <circle cx="200" cy="186" r="6" fill="#2d1010" />

    <!-- Gold Edge Connector -->
    <rect x="0" y="226" width="320" height="24" fill="url(#goldEdge)" />
    <!-- Connector pin divisions -->
    <g stroke="#1a1c1e" stroke-width="2">
      <line x1="20" y1="226" x2="20" y2="250" />
      <line x1="40" y1="226" x2="40" y2="250" />
      <line x1="60" y1="226" x2="60" y2="250" />
      <line x1="260" y1="226" x2="260" y2="250" />
      <line x1="280" y1="226" x2="280" y2="250" />
      <line x1="300" y1="226" x2="300" y2="250" />
      <!-- Middle smaller pads -->
      <line x1="80" y1="236" x2="80" y2="250" stroke-width="1.5" />
      <line x1="100" y1="236" x2="100" y2="250" stroke-width="1.5" />
      <line x1="120" y1="236" x2="120" y2="250" stroke-width="1.5" />
      <line x1="140" y1="236" x2="140" y2="250" stroke-width="1.5" />
      <line x1="160" y1="236" x2="160" y2="250" stroke-width="1.5" />
      <line x1="180" y1="236" x2="180" y2="250" stroke-width="1.5" />
      <line x1="200" y1="236" x2="200" y2="250" stroke-width="1.5" />
      <line x1="220" y1="236" x2="220" y2="250" stroke-width="1.5" />
      <line x1="240" y1="236" x2="240" y2="250" stroke-width="1.5" />
    </g>
    <!-- Pin Labels -->
    <text x="30" y="243" fill="#111" font-size="9" font-family="sans-serif" font-weight="bold" text-anchor="middle">0</text>
    <text x="50" y="243" fill="#111" font-size="9" font-family="sans-serif" font-weight="bold" text-anchor="middle">1</text>
    <text x="270" y="243" fill="#111" font-size="8" font-family="sans-serif" font-weight="bold" text-anchor="middle">3V</text>
    <text x="290" y="243" fill="#111" font-size="8" font-family="sans-serif" font-weight="bold" text-anchor="middle">GND</text>
  </g>

  <!-- Incoming Radio Waves -->
  <g transform="translate(140, 260)" stroke="#4ade80" stroke-width="3" fill="none" opacity="0.85">
    <path d="M 0, -40 A 50,50 0 0,1 0,40" stroke-dasharray="6,4" />
    <path d="M 25, -28 A 35,35 0 0,1 25,28" />
    <path d="M 50, -15 A 20,20 0 0,1 50,15" />
  </g>
  <text x="140" y="325" fill="#86efac" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle">SEÑAL RADIO</text>
  <text x="140" y="342" fill="#bbf7d0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" text-anchor="middle">Canal 1: "CESTO LLENO"</text>

  <!-- Alert Badge -->
  <g transform="translate(580, 240)">
    <rect width="180" height="70" rx="12" fill="#ef4444" opacity="0.15" stroke="#ef4444" stroke-width="1.5" />
    <circle cx="25" cy="35" r="14" fill="#ef4444" />
    <text x="25" y="40" fill="#fff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">!</text>
    <text x="50" y="30" fill="#fca5a5" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">¡AVISO ACTIVADO!</text>
    <text x="50" y="48" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Despachar recolector</text>
  </g>
</svg>
